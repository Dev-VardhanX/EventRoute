services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eventroute
      POSTGRES_PASSWORD: eventroute
      POSTGRES_DB: eventroute
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
volumes:
  pgdata:
