name: ML CI

on:
  push:
    paths:
      - 'ml/**'
      - '.github/workflows/ml.yml'
  pull_request:
    paths:
      - 'ml/**'
      - '.github/workflows/ml.yml'

jobs:
  test:
    name: ML Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'ml/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt -r ml/requirements-api.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          cd ml
          ruff check .

      - name: Generate report charts
        run: |
          cd ml
          python scripts/make_report.py

      - name: Run test suite
        run: |
          cd ml
          pytest -q

      - name: Training smoke run (synthetic)
        run: |
          cd ml
          python -m eventroute_ml.train --synthetic
